name: Utility idea
description: Suggest a new utility (tool) for Zephydian
labels: ["utility-idea"]
body:
  - type: input
    id: name
    attributes:
      label: Utility
      description: What would it do?
      placeholder: "Clipboard history"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it fit Zephydian?
      description: Zephydian utilities should open instantly, work in a small panel, be keyboard-friendly, and stay very lightweight. No network access.
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to try building it myself
