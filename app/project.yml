# Zephydian Xcode project spec.
#
# This file is the SOURCE OF TRUTH for the Xcode project. XcodeGen turns it into
# Zephydian.xcodeproj (which is generated and git-ignored):
#
#     brew install xcodegen      # once
#     cd app && xcodegen         # after changing this file
#
# ⚠️ Change build settings HERE, not in Xcode's UI. Edits made in Xcode's
# settings screens are overwritten the next time the project is generated.
# (Adding/removing .swift files is fine anywhere: the Zephydian/ folder is synced.)

name: Zephydian

options:
  bundleIdPrefix: com.ahmastan
  projectFormat: xcode16_0          # opens in Xcode 16+ and on GitHub's build machines
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor   # UI code runs on the main thread by default
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: 0.7.0                   # the version users see
    CURRENT_PROJECT_VERSION: 8                 # build number, bump every release

packages:
  # The app switcher and Finder cut and paste, copied from Vorssaint (GPL-3.0-or-later). A package of
  # its own because it keeps Vorssaint's Swift settings (Swift 5 mode, no main-actor default).
  SwitcherKit:
    path: SwitcherKit

targets:
  Zephydian:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Zephydian
        type: syncedFolder
    dependencies:
      - package: SwitcherKit
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: Zephydian
        CFBundleDisplayName: Zephydian
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true                      # menu bar app: no Dock icon
        NSMicrophoneUsageDescription: "Zephydian records your microphone with a screen recording, only when you switch it on (Capture)."
        NSCameraUsageDescription: "Zephydian shows your camera in a small floating mirror, only while you have it open (Camera Mirror)."
        NSAudioCaptureUsageDescription: "Zephydian changes the volume of each app (Sound Mixer) by passing that app's sound through itself. Nothing is recorded or saved."
        NSAppleEventsUsageDescription: "Zephydian asks Finder to move the files you cut and paste, and which folder is open to save a pasted image there (Finder Shortcuts)."
        NSHumanReadableCopyright: "© 2026 ahmastan. GPL-3.0-or-later."
    entitlements:
      path: Config/Zephydian.entitlements
      # Not in the App Sandbox: features like Dock Preview and the app switcher read and arrange other
      # apps' windows through macOS Accessibility, which the sandbox blocks. Hardened Runtime stays on.
      # Packs are still limited by PackRuntime itself (no network, no files, only declared capabilities).
      # Hardened Runtime resource entitlements are added here only when a feature that needs them is built.
      properties:
        # Finder Shortcuts asks Finder which folder its window shows (macOS asks the person once).
        com.apple.security.automation.apple-events: true
        # Capture's screen recording can include the microphone; Camera Mirror shows the camera.
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmastan.zephydian
        PRODUCT_NAME: Zephydian
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"                # "Sign to Run Locally" (free, no Apple account)
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon      # Resources/AppIcon.icon (Icon Composer)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # Release apps ship without debug symbols (they stay in the separate .dSYM next to the app),
        # which more than halves the download.
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global
    scheme: {}
